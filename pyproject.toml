[project]
name = "commute-trains"
version = "0.1.0"
description = "Live train departures from home station to work destinations (National Rail LDBSVWS)."
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "python-dotenv>=1.0"]

[project.scripts]
commute-trains = "commute_trains.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commute_trains"]
